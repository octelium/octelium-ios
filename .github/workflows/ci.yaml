name: CI

permissions: {}

on:
  push:
    branches: [main]
  pull_request:

jobs:
  kit:
    runs-on: ubuntu-24.04
    container: swift:6.2-noble
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install protoc
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends protobuf-compiler
      - name: Verify the generated sources
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ./scripts/generate-proto.sh
          git diff --exit-code -- OcteliumKit/Sources
      - run: swift test --package-path OcteliumKit

  host:
    runs-on: ubuntu-24.04
    container: swift:6.2-noble
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: octelium/octelium
          ref: main
          path: octelium-source
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: octelium-source/go.work
          cache-dependency-path: octelium-source/client/liboctelium/go.sum
      - name: Build the host library
        env:
          CC: clang
          OCTELIUM_SOURCE_DIR: ${{ github.workspace }}/octelium-source
        run: ./scripts/build-host-libs.sh
      - name: Run the liboctelium integration tests
        run: swift test --package-path HostTests

  ios:
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: octelium/octelium
          ref: main
          path: octelium-source
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: octelium-source/go.work
          cache-dependency-path: octelium-source/client/liboctelium/go.sum
      - name: Build liboctelium
        env:
          OCTELIUM_SOURCE_DIR: ${{ github.workspace }}/octelium-source
        run: ./scripts/build-liboctelium.sh
      - name: Generate the project
        shell: bash
        run: |
          set -euo pipefail
          brew install xcodegen
          ./scripts/generate-project.sh
      - name: Select a simulator
        shell: bash
        run: ./scripts/select-simulator.sh >> "$GITHUB_ENV"
      - name: Test
        run: |
          xcodebuild test -project Octelium.xcodeproj -scheme Octelium \
            -destination "$SIMULATOR" -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO
      - name: Build for devices
        run: |
          xcodebuild build -project Octelium.xcodeproj -scheme Octelium -configuration Release \
            -destination 'generic/platform=iOS' -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO
