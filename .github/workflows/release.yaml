name: Release

permissions: {}

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      liboctelium-tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate versions
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          expected="${RELEASE_VERSION#v}"
          version="$(sed -n 's/^MARKETING_VERSION = \(.*\)$/\1/p' Config/Octelium.xcconfig)"
          [[ "$version" == "$expected" ]]
          IFS=. read -r major minor patch <<< "$expected"
          build="$(sed -n 's/^CURRENT_PROJECT_VERSION = \(.*\)$/\1/p' Config/Octelium.xcconfig)"
          [[ "$build" == "$((major * 1000000 + minor * 1000 + patch))" ]]
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          requested="$(gh release view --repo octelium/liboctelium --json tagName --jq .tagName)"
          [[ "$requested" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "tag=$requested" >> "$GITHUB_OUTPUT"

  build:
    needs: validate
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: octelium/liboctelium
          ref: ${{ needs.validate.outputs.liboctelium-tag }}
          path: liboctelium-source
          persist-credentials: false
      - name: Install Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios
      - name: Build liboctelium ${{ needs.validate.outputs.liboctelium-tag }}
        env:
          LIBOCTELIUM_SOURCE_DIR: ${{ github.workspace }}/liboctelium-source
          LIBOCTELIUM_TAG: ${{ needs.validate.outputs.liboctelium-tag }}
        run: ./scripts/build-liboctelium.sh
      - name: Generate the project
        shell: bash
        run: |
          set -euo pipefail
          brew install xcodegen
          ./scripts/generate-project.sh
      - name: Select a simulator
        shell: bash
        run: ./scripts/select-simulator.sh >> "$GITHUB_ENV"
      - name: Test
        run: |
          swift test --package-path OcteliumKit
          xcodebuild test -project Octelium.xcodeproj -scheme Octelium \
            -destination "$SIMULATOR" -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO
      - name: Prepare the signing identity
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          APP_PROFILE_BASE64: ${{ secrets.IOS_APP_PROFILE_BASE64 }}
          TUNNEL_PROFILE_BASE64: ${{ secrets.IOS_TUNNEL_PROFILE_BASE64 }}
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          for name in CERTIFICATE_BASE64 CERTIFICATE_PASSWORD APP_PROFILE_BASE64 TUNNEL_PROFILE_BASE64 TEAM_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::The IOS_${name} secret is not set. iOS releases must be signed."
              exit 1
            fi
          done

          keychain="$RUNNER_TEMP/octelium.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" > /dev/null
          security list-keychain -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/certificate.p12"

          profiles="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$profiles"
          for name in APP TUNNEL; do
            var="${name}_PROFILE_BASE64"
            file="$RUNNER_TEMP/${name}.mobileprovision"
            printf '%s' "${!var}" | base64 --decode > "$file"
            security cms -D -i "$file" > "$RUNNER_TEMP/${name}.plist"
            uuid="$(plutil -extract UUID raw "$RUNNER_TEMP/${name}.plist")"
            profile="$(plutil -extract Name raw "$RUNNER_TEMP/${name}.plist")"
            cp "$file" "$profiles/$uuid.mobileprovision"
            echo "OCTELIUM_${name}_PROFILE=$profile" >> "$GITHUB_ENV"
          done
          echo "OCTELIUM_DEVELOPMENT_TEAM=$TEAM_ID" >> "$GITHUB_ENV"
      - name: Build application
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          EXPORT_METHOD: ${{ vars.IOS_EXPORT_METHOD || 'app-store-connect' }}
        shell: bash
        run: |
          set -euo pipefail
          bundle_id="$(sed -n 's/^OCTELIUM_BUNDLE_ID = \(.*\)$/\1/p' Config/Octelium.xcconfig)"
          key="${bundle_id//./\\.}"

          xcodebuild archive -project Octelium.xcodeproj -scheme Octelium -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/Octelium.xcarchive \
            -skipPackagePluginValidation \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            OCTELIUM_DEVELOPMENT_TEAM="$OCTELIUM_DEVELOPMENT_TEAM" \
            OCTELIUM_APP_PROFILE="$OCTELIUM_APP_PROFILE" \
            OCTELIUM_TUNNEL_PROFILE="$OCTELIUM_TUNNEL_PROFILE" \
            OCTELIUM_RELEASE_TAG="$RELEASE_TAG"

          plutil -create xml1 build/ExportOptions.plist
          plutil -insert method -string "$EXPORT_METHOD" build/ExportOptions.plist
          plutil -insert teamID -string "$OCTELIUM_DEVELOPMENT_TEAM" build/ExportOptions.plist
          plutil -insert signingStyle -string manual build/ExportOptions.plist
          plutil -insert provisioningProfiles -dictionary build/ExportOptions.plist
          plutil -insert "provisioningProfiles.$key" -string "$OCTELIUM_APP_PROFILE" build/ExportOptions.plist
          plutil -insert "provisioningProfiles.$key\.tunnel" -string "$OCTELIUM_TUNNEL_PROFILE" build/ExportOptions.plist

          xcodebuild -exportArchive -archivePath build/Octelium.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist -exportPath build/export
      - name: Verify the artifacts
        shell: bash
        run: |
          set -euo pipefail
          plist() {
            /usr/libexec/PlistBuddy -c "Print :$2" "$1"
          }

          app="build/Octelium.xcarchive/Products/Applications/Octelium.app"
          appex="$app/PlugIns/OcteliumTunnel.appex"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -d --entitlements - --xml "$app" > build/app.entitlements
          codesign -d --entitlements - --xml "$appex" > build/tunnel.entitlements

          for file in build/app.entitlements build/tunnel.entitlements; do
            [[ "$(plist "$file" com.apple.developer.networking.networkextension:0)" == "packet-tunnel-provider" ]]
          done

          app_group="$(plist build/app.entitlements com.apple.security.application-groups:0)"
          [[ -n "$app_group" ]]
          [[ "$app_group" == "$(plist build/tunnel.entitlements com.apple.security.application-groups:0)" ]]
          [[ "$app_group" == "$(plist "$app/Info.plist" OcteliumAppGroup)" ]]
          [[ "$(plist "$app/Info.plist" OcteliumTunnelBundleID)" == "$(plist "$appex/Info.plist" CFBundleIdentifier)" ]]
          ls build/export/*.ipa
      - name: Collect artifacts
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          LIBOCTELIUM_TAG: ${{ needs.validate.outputs.liboctelium-tag }}
        shell: bash
        run: |
          set -euo pipefail
          output="$PWD/release-output"
          mkdir "$output"
          cp build/export/*.ipa "$output/octelium-ios-${RELEASE_VERSION}.ipa"
          (cd build/Octelium.xcarchive && zip -qry "$output/octelium-ios-${RELEASE_VERSION}-dSYMs.zip" dSYMs)
          printf '%s\n' "$LIBOCTELIUM_TAG" > "$output/LIBOCTELIUM_VERSION"
          cp liboctelium/LIBOCTELIUM_COMMIT "$output/LIBOCTELIUM_COMMIT"
      - name: Clean up the signing identity
        if: always()
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/octelium.keychain-db" || true
          rm -rf "$HOME/Library/MobileDevice/Provisioning Profiles"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-ios
          path: release-output/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: release-*
          path: artifacts
      - name: Prepare release
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-files
          find artifacts -type f -exec cp {} release-files/ \;
          cd release-files
          sha256sum * > SHA256SUMS
      - id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-checksums: release-files/SHA256SUMS
      - name: Add attestation
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        shell: bash
        run: cp "$ATTESTATION_BUNDLE" release-files/release-attestation.json
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          draft: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-files/*
