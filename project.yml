name: Octelium

options:
  bundleIdPrefix: com.octelium
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: false

configFiles:
  Debug: Config/Octelium.xcconfig
  Release: Config/Octelium.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    DEVELOPMENT_TEAM: $(OCTELIUM_DEVELOPMENT_TEAM)
    CODE_SIGN_STYLE: Automatic
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ENABLE_MODULE_VERIFIER: NO

packages:
  OcteliumKit:
    path: OcteliumKit

targets:
  Octelium:
    type: application
    platform: iOS
    sources:
      - path: Octelium
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: Octelium
        PRODUCT_BUNDLE_IDENTIFIER: $(OCTELIUM_BUNDLE_ID)
        INFOPLIST_FILE: Octelium/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Octelium/Resources/Octelium.entitlements
        PROVISIONING_PROFILE_SPECIFIER: $(OCTELIUM_APP_PROFILE)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: OcteliumTunnel
      - package: OcteliumKit
        product: OcteliumProto
      - package: OcteliumKit
        product: OcteliumCore
      - package: OcteliumKit
        product: OcteliumAPI
      - package: OcteliumKit
        product: LibOctelium
      - framework: liboctelium/liboctelium.xcframework
        embed: false
      - sdk: NetworkExtension.framework

  OcteliumTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: OcteliumTunnel
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: OcteliumTunnel
        PRODUCT_BUNDLE_IDENTIFIER: $(OCTELIUM_BUNDLE_ID).tunnel
        INFOPLIST_FILE: OcteliumTunnel/Info.plist
        CODE_SIGN_ENTITLEMENTS: OcteliumTunnel/OcteliumTunnel.entitlements
        PROVISIONING_PROFILE_SPECIFIER: $(OCTELIUM_TUNNEL_PROFILE)
        APPLICATION_EXTENSION_API_ONLY: YES
    dependencies:
      - package: OcteliumKit
        product: OcteliumProto
      - package: OcteliumKit
        product: OcteliumCore
      - package: OcteliumKit
        product: OcteliumAPI
      - package: OcteliumKit
        product: LibOctelium
      - framework: liboctelium/liboctelium.xcframework
        embed: false
      - sdk: NetworkExtension.framework

  OcteliumTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OcteliumTests
      - path: OcteliumTunnel/NetworkSettings.swift
      - path: Octelium/App/VPNController.swift
      - path: Octelium/App/PrefsStore.swift
      - path: Octelium/UI/Theme/Theme.swift
      - path: Octelium/UI/Services/ServiceTypes.swift
      - path: Shared/AppGroup.swift
      - path: Shared/KeychainStore.swift
      - path: Shared/Logging.swift
      - path: Shared/PathMonitor.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(OCTELIUM_BUNDLE_ID).tests
    dependencies:
      - package: OcteliumKit
        product: OcteliumProto
      - package: OcteliumKit
        product: OcteliumCore
      - sdk: NetworkExtension.framework

schemes:
  Octelium:
    build:
      targets:
        Octelium: all
        OcteliumTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - OcteliumTests
    archive:
      config: Release
